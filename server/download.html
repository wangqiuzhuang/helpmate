<title>HelpMate 下载</title>

<style>
  :root { --brand: #d63a73; --ink: #1f1d24; --muted: #6e6878; --bg: #f6f5f7; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Microsoft YaHei', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 56px 24px calc(32px + env(safe-area-inset-bottom)); }
  .logo { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 28px rgba(214, 58, 115, 0.25); }
  h1 { margin: 20px 0 6px; font-size: 28px; }
  .sub { margin: 0; color: var(--muted); font-size: 16px; text-align: center; line-height: 1.6; max-width: 320px; }
  .langs { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .card { width: 100%; max-width: 360px; margin-top: 32px; background: #fff; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 27px; font-size: 17px; font-weight: 700; text-decoration: none; border: 0; cursor: pointer; }
  .btn-main { background: var(--brand); color: #fff; }
  .btn-sub { background: #f3f1f5; color: var(--ink); }
  .btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
  .ver { text-align: center; font-size: 13px; color: var(--muted); }
  .note { font-size: 14px; color: var(--muted); line-height: 1.7; white-space: pre-wrap; border-top: 1px solid #efecf1; padding-top: 12px; }
  .tip { margin-top: 18px; max-width: 340px; font-size: 13px; color: var(--muted); line-height: 1.7; text-align: center; }
  .mask { position: fixed; inset: 0; background: rgba(20, 18, 24, 0.86); color: #fff; display: none; flex-direction: column; align-items: flex-end; padding: 18px 22px; z-index: 10; }
  .mask.show { display: flex; }
  .arrow { font-size: 44px; line-height: 1; margin-right: 6px; }
  .mask p { margin: 14px 0 0; font-size: 18px; line-height: 1.7; text-align: right; }
  .mask b { color: #ffb3cd; }
</style>

    en: { slogan: 'A mutual-aid community for your campus', android: 'Download for Android', ios: 'Download for iPhone', iosSoon: 'iPhone version coming soon', ver: 'Latest version ', tip: 'If Android warns about unknown sources, tap “Allow” to install.', mask: 'Tap <b>···</b> at the top right<br>and choose <b>Open in browser</b><br>to download', loading: 'Loading…' },
    vi: { slogan: 'Cộng đồng giúp đỡ nhau của sinh viên cùng trường', android: 'Tải cho Android', ios: 'Tải cho iPhone', iosSoon: 'Phiên bản iPhone sắp ra mắt', ver: 'Phiên bản mới nhất ', tip: 'Nếu Android cảnh báo nguồn không xác định, hãy chọn «Cho phép» để cài đặt.', mask: 'Nhấn <b>···</b> ở góc trên bên phải<br>chọn <b>Mở bằng trình duyệt</b><br>rồi tải về', loading: 'Đang tải…' },
  };
  var nav = (navigator.language || 'zh').toLowerCase();
  var lang = /^ko/.test(nav) ? 'ko' : /^vi/.test(nav) ? 'vi' : /^zh/.test(nav) ? 'zh' : 'en';
  var T = L[lang];
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  var isAndroid = /Android/i.test(ua);
  // 微信 / QQ 内置浏览器不能下载 APK、也打不开 App Store 外链,提示去浏览器打开
  var inWeChat = /MicroMessenger|QQ\//i.test(ua);
  var $ = function (id) { return document.getElementById(id); };
  document.documentElement.lang = lang;
  $('slogan').textContent = T.slogan;
  $('android').textContent = T.android;
  $('ios').textContent = T.iosSoon;
  $('ver').textContent = T.loading;
  $('tip').textContent = isIOS ? '' : T.tip;
  if (isIOS) $('ios').parentNode.insertBefore($('ios'), $('android'));
  if (isIOS) { $('ios').className = 'btn btn-main'; $('android').className = 'btn btn-sub'; }
  if (inWeChat) { $('maskText').innerHTML = T.mask; $('mask').className = 'mask show'; }

  fetch('/api/call', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: 'krstuast', data: { action: 'getAppVersion' } }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var v = (j && j.result) || {};
      $('ver').textContent = v.version ? T.ver + v.version : '';
      if (v.url) { $('android').href = v.url; $('android').removeAttribute('aria-disabled'); }
      if (v.iosUrl) { $('ios').href = v.iosUrl; $('ios').textContent = T.ios; $('ios').removeAttribute('aria-disabled'); }
      if (v.note) { $('note').textContent = v.note; $('note').hidden = false; }
      // 安卓手机在普通浏览器里打开:自动开始下载
      if (isAndroid && !inWeChat && v.url && /[?&]auto=1/.test(location.search)) location.href = v.url;
    })
    .catch(function () { $('ver').textContent = ''; });
})();
</script>

</html>
