# /etc/nginx/sites-available/krstuast-api —— 独立站点,不影响其他站点
# 启用:ln -s /etc/nginx/sites-available/krstuast-api /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS:certbot --nginx -d kr.new-apis.com
server {
    listen 80;
    listen [::]:80;
    server_name kr.new-apis.com;

    client_max_body_size 12m;

    # 接口 JSON 压缩,弱网下列表加载更快
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # 图片直接由 Nginx 提供
    location /uploads/ {
        alias /opt/krstuast/uploads/;
        # 文件名随机且不会被覆盖:可以长期缓存
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 实时消息(WebSocket)
    location /ws {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
